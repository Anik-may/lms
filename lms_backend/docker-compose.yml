name: lms

services:
  api:
    build: .
    image: lms-api
    container_name: lms-api
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://lms:lms@postgres:5432/lms
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-anikdas@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      STORAGE_PROVIDER: s3
      S3_ENDPOINT_URL: http://storage:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      # "Test payment" checkout that charges nobody. Never enable where money is real.
      ALLOW_MOCK_PAYMENTS: ${ALLOW_MOCK_PAYMENTS:-false}
      S3_ACCESS_KEY: lmsaccess
      S3_SECRET_KEY: lmssecret123
      # Email goes to Mailpit (inbox at http://localhost:8025) unless you point these at a
      # real SMTP server, e.g. SMTP_HOST=smtp.gmail.com SMTP_PORT=587 SMTP_SECURITY=starttls
      # with SMTP_USERNAME / SMTP_PASSWORD (a Gmail app password) in .env.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURITY: ${SMTP_SECURITY:-none}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-Institute <no-reply@institute.local>}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_started
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: lms-mailpit
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: lms-postgres
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - lms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lms-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for course images and videos.
  # API on :9000, web console at http://localhost:9001/rustfs/console/ (log in with the keys below).
  storage:
    image: rustfs/rustfs:latest
    container_name: lms-storage
    environment:
      RUSTFS_ACCESS_KEY: lmsaccess
      RUSTFS_SECRET_KEY: lmssecret123
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - lms_storage_data:/data

volumes:
  lms_postgres_data:
  lms_storage_data:
